<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO DRIFT RACING</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080d16;color:white;font-family:Arial,sans-serif;overflow:hidden}
#game{width:100vw;height:100vh;display:block}
.hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;gap:10px}
.panel{background:#101b2ddd;border:1px solid #ffffff30;padding:12px 18px;border-radius:12px;box-shadow:0 5px 20px #0008}
.panel small{color:#9fb3ca;font-size:11px}
.panel h2{font-size:24px;color:#00eaff}
#driftScore{color:#ffb52e}#speed{color:#42ff91}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050b16d9;z-index:5}
.box{width:min(420px,90%);text-align:center;padding:35px 25px;border:1px solid #00d9ff66;border-radius:20px;background:linear-gradient(145deg,#14243a,#080e19);box-shadow:0 0 40px #00cfff22}
.box h1{font-size:38px;color:#00eaff;text-shadow:0 0 20px #00dfff}
.box p{color:#b4c6d8;line-height:1.7;margin:15px 0}
button{border:0;border-radius:10px;background:linear-gradient(90deg,#00c9ff,#0077ff);color:white;padding:14px 28px;font-size:17px;font-weight:bold;cursor:pointer;margin:6px}
button:hover{filter:brightness(1.2)}
#pause{position:absolute;right:18px;top:115px;padding:10px 15px;pointer-events:auto}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.control{width:75px;height:75px;border-radius:50%;background:#162b45cc;border:2px solid #00dfff;font-size:27px;pointer-events:auto;touch-action:none;user-select:none}
#driftBtn{background:#8c3b17cc;border-color:#ff9a32}
#message{position:absolute;top:43%;width:100%;text-align:center;font-size:25px;font-weight:bold;color:#ffca43;text-shadow:0 0 15px orange;pointer-events:none}
@media(min-width:800px){#controls{opacity:.45}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="panel"><small>🏆 SCORE</small><h2 id="score">0</h2></div>
 <div class="panel"><small>🔥 DRIFT</small><h2 id="driftScore">x1</h2></div>
 <div class="panel"><small>⚡ SPEED</small><h2 id="speed">0</h2></div>
 <div class="panel"><small>🥇 RECORD</small><h2 id="best">0</h2></div>
</div>
<button id="pause" onclick="togglePause()">Ⅱ</button>
<div id="message"></div>
<div id="controls">
 <div><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div>
 <button class="control" id="driftBtn">🔥</button>
</div>
<div id="menu"><div class="box">
 <h1>PRO DRIFT</h1>
 <p>🏎️ PROFESSIONAL RACING<br>🔥 Drift effektlari<br>⚡ Tezlik va ball to‘plash<br>🚧 To‘siqlardan qoch!</p>
 <p>Kompyuter: A/D yoki ←/→<br>Drift: SPACE tugmasi</p>
 <button onclick="startGame()">START GAME</button>
</div></div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W,H;
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio}
resize();addEventListener("resize",resize);
let running=false,paused=false,score=0,best=Number(localStorage.getItem("driftBest")||0);
let speed=0,playerX=0,roadCurve=0,drift=false,angle=0,roadOffset=0,world=0;
let obstacles=[],particles=[],keys={},shake=0,combo=0,lastTime=0;
document.getElementById("best").textContent=best;
function roadAt(y){let t=y/H;let curve=Math.sin(world*.00045+t*3)*.25+Math.sin(world*.00019+t*5)*.13;return W/2+curve*W}
function startGame(){score=0;speed=0;playerX=0;obstacles=[];particles=[];combo=0;roadOffset=0;world=0;angle=0;shake=0;running=true;paused=false;document.getElementById("menu").style.display="none";lastTime=performance.now();requestAnimationFrame(loop)}
function togglePause(){if(!running)return;paused=!paused;document.getElementById("pause").textContent=paused?"▶":"Ⅱ";if(!paused){lastTime=performance.now();requestAnimationFrame(loop)}}
function endGame(){running=false;if(score>best){best=Math.floor(score);localStorage.setItem("driftBest",best)}document.getElementById("best").textContent=best;document.querySelector("#menu h1").textContent="GAME OVER!";document.querySelector("#menu p").innerHTML="🏆 Ball: "+Math.floor(score)+"<br>🥇 Rekord: "+best+"<br>Yana urinib ko‘r!";document.querySelector("#menu button").textContent="RESTART";document.getElementById("menu").style.display="flex"}
function drawRoad(){
 const horizon=H*.20,segments=90;
 for(let i=0;i<segments;i++){
  let t=i/segments,t2=(i+1)/segments,y=horizon+t*(H-horizon),y2=horizon+t2*(H-horizon);
  let x1=roadAt(y),x2=roadAt(y2),rw1=W*(.10+t*.53),rw2=W*(.10+t2*.53);
  let stripe=Math.floor((world/20+t*100))%2;
  ctx.fillStyle=stripe?"#263c2b":"#1c3025";ctx.fillRect(0,y,W,y2-y+1);
  ctx.beginPath();ctx.moveTo(x1-rw1,y);ctx.lineTo(x1+rw1,y);ctx.lineTo(x2+rw2,y2);ctx.lineTo(x2-rw2,y2);ctx.closePath();ctx.fillStyle="#333942";ctx.fill();
  ctx.strokeStyle="#eeeeee";ctx.lineWidth=3+8*t;ctx.beginPath();ctx.moveTo(x1-rw1,y);ctx.lineTo(x2-rw2,y2);ctx.moveTo(x1+rw1,y);ctx.lineTo(x2+rw2,y2);ctx.stroke();
  if(stripe){ctx.strokeStyle="#e8e8d5";ctx.lineWidth=2+5*t;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y2);ctx.stroke()}
 }
}
function drawCar(x,y,rotation){
 ctx.save();ctx.translate(x,y);ctx.rotate(rotation);
 ctx.fillStyle="#0009";ctx.beginPath();ctx.ellipse(0,8,25,43,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#090b10";ctx.fillRect(-25,-29,9,24);ctx.fillRect(16,-29,9,24);ctx.fillRect(-25,20,9,22);ctx.fillRect(16,20,9,22);
 let g=ctx.createLinearGradient(-20,0,20,0);g.addColorStop(0,"#a50018");g.addColorStop(.5,"#ff263d");g.addColorStop(1,"#850017");
 ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-21,-42,42,84,11);ctx.fill();
 ctx.fillStyle="#182c43";ctx.beginPath();ctx.roundRect(-15,-25,30,22,6);ctx.fill();
 ctx.fillStyle="#142638";ctx.beginPath();ctx.roundRect(-15,5,30,16,4);ctx.fill();
 ctx.fillStyle="#ff6876";ctx.fillRect(-17,-4,34,5);
 ctx.fillStyle="#fff8aa";ctx.fillRect(-17,-40,9,5);ctx.fillRect(8,-40,9,5);
 ctx.fillStyle="#ff001c";ctx.fillRect(-17,35,9,5);ctx.fillRect(8,35,9,5);
 ctx.restore()
}
function addParticles(){let x=W/2+playerX*W*.34,y=H*.80;for(let i=0;i<3;i++)particles.push({x:x+(Math.random()-.5)*35,y:y+25,vx:(Math.random()-.5)*2,vy:Math.random()*2+1,life:1,size:Math.random()*8+3})}
function drawParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.002*dt;ctx.globalAlpha=Math.max(0,p.life*.4);ctx.fillStyle="#d7dce0";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1}
function spawnObstacle(){obstacles.push({x:(Math.random()-.5)*1.3,y:H*.25,type:Math.random()>.5?"cone":"car"})}
function drawObstacles(dt){
 for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];o.y+=speed*dt*.55;let t=o.y/H,x=roadAt(o.y)+o.x*W*.35,size=12+t*38;
  ctx.save();ctx.translate(x,o.y);
  if(o.type==="cone"){ctx.fillStyle="#ff7024";ctx.beginPath();ctx.moveTo(0,-size);ctx.lineTo(-size*.6,size);ctx.lineTo(size*.6,size);ctx.fill();ctx.fillStyle="white";ctx.fillRect(-size*.35,5,size*.7,5)}
  else{ctx.fillStyle="#e8ae27";ctx.fillRect(-size*.55,-size,size*1.1,size*1.7);ctx.fillStyle="#182a3b";ctx.fillRect(-size*.38,-size*.7,size*.76,size*.35);ctx.fillStyle="#ff2020";ctx.fillRect(-size*.4,size*.5,size*.22,5);ctx.fillRect(size*.18,size*.5,size*.22,5)}
  ctx.restore();
  let px=W/2+playerX*W*.34;
  if(o.y>H*.75&&o.y<H*.87&&Math.abs(x-px)<38+size*.4){endGame();return}
  if(o.y>H+100)obstacles.splice(i,1)
 }
}
function update(dt){
 let left=keys.ArrowLeft||keys.a||keys.A,right=keys.ArrowRight||keys.d||keys.D;
 drift=keys.Space||keys[" "];
 if(left)playerX-=.0032*dt*(drift?1.4:1);if(right)playerX+=.0032*dt*(drift?1.4:1);
 playerX=Math.max(-1,Math.min(1,playerX));speed=Math.min(250,speed+.018*dt);world+=speed*dt*.6;roadOffset+=speed*dt;
 let drifting=drift&&(left||right);
 if(drifting){combo=Math.min(combo+dt*.008,10);score+=dt*.018*combo*(speed/100+1);angle+=(right?1:-1)*.0007*dt;addParticles()}
 else{combo=Math.max(0,combo-dt*.004);angle*=.94}
 if(Math.abs(playerX)>.95)speed=Math.max(0,speed-.06*dt);
 if(Math.random()<.009*dt*(speed/150+1))spawnObstacle();
 document.getElementById("score").textContent=Math.floor(score);
 document.getElementById("speed").textContent=Math.floor(speed)+" KM/H";
 document.getElementById("driftScore").textContent="x"+Math.max(1,combo).toFixed(1)
}
function draw(dt){
 ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}
 let sky=ctx.createLinearGradient(0,0,0,H*.4);sky.addColorStop(0,"#07172d");sky.addColorStop(1,"#526a79");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.4);
 ctx.fillStyle="#d7e9f3";ctx.beginPath();ctx.arc(W*.8,H*.12,22*devicePixelRatio,0,Math.PI*2);ctx.fill();
 for(let i=0;i<20;i++){let x=i*W/10,h=(40+(i*37%70))*devicePixelRatio;ctx.fillStyle="#10202c";ctx.fillRect(x,H*.2-h,W*.055,h)}
 drawRoad();drawObstacles(dt);drawParticles(dt);
 let carX=W/2+playerX*W*.34,carY=H*.80;
 drawCar(carX,carY,angle+(keys.ArrowLeft||keys.a?-.08:0)+(keys.ArrowRight||keys.d?.08:0));
 if(drift){ctx.fillStyle="#ffb32b";ctx.font="bold "+(24*devicePixelRatio)+"px Arial";ctx.textAlign="center";ctx.fillText("🔥 DRIFT!",W/2,H*.55)}
 ctx.restore()
}
function loop(time){if(!running||paused)return;let dt=Math.min(time-lastTime,40);lastTime=time;update(dt);draw(dt);if(running)requestAnimationFrame(loop)}
document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key==="Escape")togglePause()});
document.addEventListener("keyup",e=>keys[e.key]=false);
function bindButton(id,key){let el=document.getElementById(id);el.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false))}
bindButton("left","ArrowLeft");bindButton("right","ArrowRight");bindButton("driftBtn","Space");
draw(0);
</script>
</body>
</html>
